name: google-tools
version: 0.1.1
description: "Google tools for coding agents: Sheets, Gmail, Drive and Google Cloud."
manifest_version: 1
requires_hermes: ">=0.22"
provides_tools:
  - google_account_read
  - google_comments_add
  - google_comments_delete
  - google_comments_edit
  - google_comments_read
  - google_comments_status
  - google_drive_copy
  - google_drive_folder_create
  - google_drive_move
  - google_drive_read
  - google_drive_rename
  - google_drive_restore
  - google_drive_trash
  - google_drive_upload
  - google_gmail_draft_create
  - google_gmail_draft_delete
  - google_gmail_draft_edit
  - google_gmail_label
  - google_gmail_label_create
  - google_gmail_read
  - google_gmail_send
  - google_gmail_trash
  - google_grant_create
  - google_grant_read
  - google_grant_revoke
  - google_run_execution_cancel
  - google_run_job_delete
  - google_run_job_deploy
  - google_run_job_run
  - google_run_read
  - google_run_revision_delete
  - google_run_service_delete
  - google_run_service_deploy
  - google_run_traffic_set
  - google_sheets_add
  - google_sheets_append
  - google_sheets_clear
  - google_sheets_create
  - google_sheets_edit
  - google_sheets_format
  - google_sheets_protect
  - google_sheets_read
  - google_sheets_restructure
  - google_sheets_tab_add
  - google_sheets_transform
  - google_youtube_caption_add
  - google_youtube_caption_update
  - google_youtube_channel_edit
  - google_youtube_comment_moderate
  - google_youtube_comment_reject
  - google_youtube_comment_reply
  - google_youtube_playlist_add
  - google_youtube_playlist_create
  - google_youtube_playlist_edit
  - google_youtube_playlist_move
  - google_youtube_playlist_remove
  - google_youtube_privacy_set
  - google_youtube_read
  - google_youtube_thumbnail_set
  - google_youtube_video_edit
  - google_youtube_video_upload
provides_hooks:
  - pre_tool_call
config_schema:
  toolsets:
    description: 'The toolsets that are on: a list of toolset names, or "all". Defaults to the package''s default toolsets.'
  read_only:
    type: bool
    description: Registers no tool that writes. Wins over every other setting.
  unattended:
    type: bool
    description: "No person can answer: writes run only under a grant that covers them."
  grants_dir:
    type: str
    description: Where grants and their use are kept; default under the user's state directory.
  tools:
    type: list
    description: Single tools to add by id, whatever their toolset.
  exclude_tools:
    type: list
    description: Single tools to remove by id. Wins over tools and toolsets.
  language:
    description: The language of the approval card, such as ja. Defaults to Hermes's display language, else English.
  require_plugins:
    type: list
    description: The Hermes plugins that must be loaded; while one is not, every write is refused before it is approved.
  emoji:
    type: dict
    description: 'The emoji shown beside each toolset, by toolset name; "" shows none. Merged over the package''s emoji.'
